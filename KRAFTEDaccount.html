<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#E0A0AC">
    <title>Account Settings | Stitches and Things</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --card-bg: rgba(255, 255, 255, 0.94);
            --primary-pink: #E0A0AC;
            --primary-pink-deep: #C97A8A;
            --text-dark: #4A3A3E;
            --text-light: #8C7B7F;
            --border-color: rgba(224, 160, 172, 0.4);
            --radius: 18px;
            --radius-pill: 999px;
            --shadow-lg: 0 20px 50px rgba(92, 74, 78, 0.15);
            --shadow-sm: 0 2px 10px rgba(92, 74, 78, 0.06);
            --transition-fast: 0.18s ease;
            --transition-base: 0.28s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            color: var(--text-dark);
            min-height: 100vh;
            min-height: 100dvh;
            -webkit-text-size-adjust: 100%;
            -webkit-tap-highlight-color: rgba(224, 160, 172, 0.25);
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 40px 16px;
            background-image: url("kraftedbg.jfif");
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            background-attachment: fixed;
            background-color: #F8E2E7;
        }

        .account-wrapper {
            width: 100%;
            max-width: 520px;
        }

        .account-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            color: var(--text-dark);
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 8px 14px;
            border-radius: var(--radius-pill);
            background: rgba(255, 255, 255, 0.55);
            transition: background-color var(--transition-fast), color var(--transition-fast);
        }

        .back-link:hover {
            background: rgba(255, 255, 255, 0.85);
            color: var(--primary-pink-deep);
        }

        .account-card {
            background: var(--card-bg);
            padding: 34px 30px;
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            border: 1px solid rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            margin-bottom: 22px;
            animation: cardEnter 0.5s cubic-bezier(0.4, 0, 0.2, 1) both;
        }

        @keyframes cardEnter {
            from { opacity: 0; transform: translateY(16px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .account-card h2 {
            font-size: 1.05rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
            color: var(--text-dark);
            font-weight: 700;
        }

        .account-card .subtitle {
            font-size: 0.78rem;
            color: var(--text-light);
            margin-bottom: 22px;
            line-height: 1.4;
        }

        .email-display {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--primary-pink-deep);
            background: rgba(248, 226, 231, 0.5);
            padding: 10px 14px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.72rem;
            font-weight: 600;
            margin-bottom: 7px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--text-dark);
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1.5px solid var(--border-color);
            border-radius: 14px;
            font-family: inherit;
            font-size: 0.88rem;
            outline: none;
            background: #fff;
            color: var(--text-dark);
            transition: border-color var(--transition-fast), box-shadow var(--transition-base);
        }

        .form-group input:hover {
            border-color: rgba(224, 160, 172, 0.75);
        }

        .form-group input:focus {
            border-color: var(--primary-pink);
            box-shadow: 0 0 0 4px rgba(224, 160, 172, 0.22);
        }

        .form-hint {
            font-size: 0.7rem;
            color: var(--text-light);
            margin-top: -8px;
            margin-bottom: 14px;
        }

        .btn-primary {
            width: 100%;
            background: linear-gradient(135deg, var(--primary-pink) 0%, var(--primary-pink-deep) 100%);
            color: white;
            border: none;
            padding: 13px;
            border-radius: var(--radius-pill);
            font-weight: 600;
            font-size: 0.83rem;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            cursor: pointer;
            margin-top: 6px;
            box-shadow: 0 5px 16px rgba(224, 160, 172, 0.42);
            transition: transform var(--transition-base), box-shadow var(--transition-base), opacity var(--transition-fast);
            font-family: inherit;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(224, 160, 172, 0.5);
        }

        .btn-primary:active {
            transform: translateY(0) scale(0.98);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .form-message {
            display: none;
            margin-top: 14px;
            padding: 11px 14px;
            border-radius: 12px;
            font-size: 0.78rem;
            font-weight: 500;
            text-align: left;
        }

        .form-message.error {
            display: block;
            background: #fdecea;
            color: #c0392b;
            border: 1px solid #f5c6c1;
        }

        .form-message.success {
            display: block;
            background: #eafaf1;
            color: #1e8449;
            border: 1px solid #c8ecd9;
        }

        #accountLoadingNote {
            text-align: center;
            color: var(--text-light);
            font-size: 0.82rem;
            padding: 30px 0;
        }

        #accountContent {
            display: none;
        }

        hr.section-divider {
            border: none;
            border-top: 1px solid var(--border-color);
            margin: 24px 0;
        }

        /* ==========================================================================
           MOBILE
           ========================================================================== */
        @media (hover: none) {
            .btn-login:hover, .btn-register:hover, .btn-primary:hover,
            .login-logo:hover, .register-logo:hover {
                transform: none;
            }
        }

        @media (max-width: 600px) {
            body {
                /* fixed backgrounds stutter badly while scrolling on iOS */
                background-attachment: scroll;
                padding: 20px 14px calc(20px + env(safe-area-inset-bottom));
                padding-top: calc(20px + env(safe-area-inset-top));
            }

            /* 16px stops iOS zooming the page the moment a field is focused */
            input {
                font-size: 16px !important;
                padding: 13px 15px !important;
            }

            button {
                min-height: 48px;
            }
        }

        /* Phone held sideways: the card is taller than the screen, so let the
           page scroll from the top instead of clipping a centred card. */
        @media (orientation: landscape) and (max-height: 520px) {
            body {
                align-items: flex-start;
                padding-top: 16px;
                padding-bottom: 16px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        @media (max-width: 600px) {
            body { padding-top: calc(16px + env(safe-area-inset-top)); }

            .account-card {
                padding: 26px 18px;
                border-radius: 22px;
                margin-bottom: 16px;
            }

            .account-topbar { margin-bottom: 12px; }

            .back-link {
                padding: 11px 16px;
                font-size: 0.82rem;
            }

            .account-card h2 { font-size: 0.98rem; }
            .email-display {
                font-size: 0.8rem;
                word-break: break-all;
            }
        }

        @media (orientation: landscape) and (max-height: 520px) {
            body { padding-top: 14px; }
            .account-card { padding: 20px 22px; }
        }
    </style>
</head>
<body data-page="account">

    <div class="account-wrapper">
        <div class="account-topbar">
            <a href="index.html" id="accountBackLink" class="back-link">← Back</a>
        </div>

        <div class="account-card">
            <p id="accountLoadingNote">Checking your session…</p>

            <div id="accountContent">
                <div class="email-display" id="accountEmailDisplay"></div>

                <div id="profileSection">
                    <h2>Profile Info</h2>
                    <div class="subtitle">Update your username and contact number.</div>

                    <form id="profileForm" novalidate>
                        <div class="form-group">
                            <label for="accountUsername">Username</label>
                            <input type="text" id="accountUsername" minlength="3" required autocomplete="username">
                        </div>
                        <div class="form-group">
                            <label for="accountContact">Contact Number</label>
                            <input type="tel" id="accountContact" placeholder="09XX XXX XXXX" required autocomplete="tel">
                        </div>

                        <button type="submit" class="btn-primary">Save Changes</button>
                        <div id="profileMessage" class="form-message"></div>
                    </form>

                    <hr class="section-divider">
                </div>

                <h2>Change Password</h2>
                <div class="subtitle">Enter your current password, then choose a new one.</div>

                <form id="passwordForm" novalidate>
                    <div class="form-group">
                        <label for="currentPassword">Current Password</label>
                        <input type="password" id="currentPassword" placeholder="••••••••" required autocomplete="current-password">
                    </div>
                    <div class="form-group">
                        <label for="newPassword">New Password</label>
                        <input type="password" id="newPassword" placeholder="••••••••" minlength="6" required autocomplete="new-password">
                    </div>
                    <div class="form-group">
                        <label for="confirmNewPassword">Confirm New Password</label>
                        <input type="password" id="confirmNewPassword" placeholder="••••••••" minlength="6" required autocomplete="new-password">
                    </div>
                    <div class="form-hint">At least 6 characters.</div>

                    <button type="submit" class="btn-primary">Update Password</button>
                    <div id="passwordMessage" class="form-message"></div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="krafted.js"></script>
</body>
</html>
