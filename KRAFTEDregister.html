<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#E0A0AC">
    <title>Create Account | Stitches and Things</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --card-bg: rgba(255, 255, 255, 0.94);
            --primary-pink: #E0A0AC;
            --primary-pink-deep: #C97A8A;
            --text-dark: #4A3A3E;
            --text-light: #7A6A6E;
            --border-color: rgba(224, 160, 172, 0.4);
            --radius: 18px;
            --radius-pill: 999px;
            --shadow-lg: 0 20px 50px rgba(92, 74, 78, 0.15);
            --transition-fast: 0.18s ease;
            --transition-base: 0.28s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            color: var(--text-dark);
            min-height: 100vh;
            min-height: 100dvh;
            -webkit-text-size-adjust: 100%;
            -webkit-tap-highlight-color: rgba(224, 160, 172, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 28px 16px;
            background-image: url("kraftedbg.jfif");
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            background-attachment: fixed;
            background-color: #F8E2E7;
        }

        .register-card {
            background: var(--card-bg);
            padding: 40px 32px;
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 440px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            animation: cardEnter 0.5s cubic-bezier(0.4, 0, 0.2, 1) both;
        }

        @keyframes cardEnter {
            from { opacity: 0; transform: translateY(20px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .register-logo {
            width: 92px;
            height: 92px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 14px;
            border: 3px solid #FFFFFF;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.12);
            transition: transform var(--transition-base);
        }

        .register-logo:hover {
            transform: scale(1.05) rotate(-4deg);
        }

        .register-card h2 {
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 1.1px;
            margin-bottom: 5px;
            color: var(--text-dark);
            font-weight: 700;
        }

        .register-card .subtitle {
            font-size: 0.8rem;
            color: var(--text-light);
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .form-row {
            display: flex;
            gap: 12px;
        }

        .form-row .form-group {
            flex: 1;
        }

        .form-group label {
            display: block;
            font-size: 0.72rem;
            font-weight: 600;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.55px;
            color: var(--text-dark);
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid var(--border-color);
            border-radius: 14px;
            font-family: inherit;
            font-size: 0.88rem;
            outline: none;
            background: #fff;
            color: var(--text-dark);
            transition: border-color var(--transition-fast), box-shadow var(--transition-base);
        }

        .form-group input:hover {
            border-color: rgba(224, 160, 172, 0.75);
        }

        .form-group input:focus {
            border-color: var(--primary-pink);
            box-shadow: 0 0 0 4px rgba(224, 160, 172, 0.22);
        }

        .form-hint {
            font-size: 0.7rem;
            color: var(--text-light);
            margin-top: 4px;
            text-align: left;
        }

        .btn-register {
            width: 100%;
            background: linear-gradient(135deg, var(--primary-pink) 0%, var(--primary-pink-deep) 100%);
            color: white;
            border: none;
            padding: 14px;
            border-radius: var(--radius-pill);
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.7px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 5px 18px rgba(224, 160, 172, 0.45);
            transition: transform var(--transition-base), box-shadow var(--transition-base), opacity var(--transition-fast);
            font-family: inherit;
        }

        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(224, 160, 172, 0.55);
        }

        .btn-register:active {
            transform: translateY(0) scale(0.98);
        }

        .btn-register:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .form-message {
            display: none;
            margin-top: 16px;
            padding: 11px 14px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 500;
            text-align: left;
        }

        .form-message.error {
            display: block;
            background: #fdecea;
            color: #c0392b;
            border: 1px solid #f5c6c1;
        }

        .form-message.success {
            display: block;
            background: #eafaf1;
            color: #1e8449;
            border: 1px solid #c8ecd9;
        }

        .login-link {
            margin-top: 20px;
            font-size: 0.8rem;
            color: var(--text-light);
        }

        .login-link a {
            color: var(--primary-pink-deep);
            font-weight: 600;
            text-decoration: none;
            transition: color var(--transition-fast);
        }

        .login-link a:hover {
            color: #A85A6A;
            text-decoration: underline;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-top: 14px;
            color: var(--text-dark);
            text-decoration: none;
            font-size: 0.78rem;
            font-weight: 500;
            padding: 8px 14px;
            border-radius: var(--radius-pill);
            transition: background-color var(--transition-fast), color var(--transition-fast);
        }

        .back-link:hover {
            background: rgba(224, 160, 172, 0.18);
            color: var(--primary-pink-deep);
        }

        @media (max-width: 560px) {
            .form-row {
                flex-direction: column;
                gap: 0;
            }
        }

        /* ==========================================================================
           MOBILE
           ========================================================================== */
        @media (hover: none) {
            .btn-login:hover, .btn-register:hover, .btn-primary:hover,
            .login-logo:hover, .register-logo:hover {
                transform: none;
            }
        }

        @media (max-width: 600px) {
            body {
                /* fixed backgrounds stutter badly while scrolling on iOS */
                background-attachment: scroll;
                padding: 20px 14px calc(20px + env(safe-area-inset-bottom));
                padding-top: calc(20px + env(safe-area-inset-top));
            }

            /* 16px stops iOS zooming the page the moment a field is focused */
            input {
                font-size: 16px !important;
                padding: 13px 15px !important;
            }

            button {
                min-height: 48px;
            }
        }

        /* Phone held sideways: the card is taller than the screen, so let the
           page scroll from the top instead of clipping a centred card. */
        @media (orientation: landscape) and (max-height: 520px) {
            body {
                align-items: flex-start;
                padding-top: 16px;
                padding-bottom: 16px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        @media (max-width: 600px) {
            .register-card {
                padding: 30px 20px;
                border-radius: 22px;
            }
            .register-logo { width: 78px; height: 78px; }
            .register-card h2 { font-size: 1.08rem; }
        }

        @media (orientation: landscape) and (max-height: 520px) {
            .register-card { padding: 22px 24px; max-width: 520px; }
            .register-logo { width: 56px; height: 56px; margin-bottom: 8px; }
        }
    </style>
</head>
<body data-page="register">

    <div class="register-card">
        <img src="Kraftedlogo.jfif" alt="Stitches and Things Logo" class="register-logo">
        <h2>Create Your Account</h2>
        <div class="subtitle">Sign up to shop with Stitches and Things</div>

        <form id="registerForm" novalidate>
            <div class="form-group">
                <label for="regEmail">Email</label>
                <input type="email" id="regEmail" placeholder="you@example.com" required autocomplete="email">
            </div>

            <div class="form-group">
                <label for="regUsername">Username</label>
                <input type="text" id="regUsername" placeholder="e.g. annacrafts" minlength="3" required autocomplete="username">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="regPassword">Password</label>
                    <input type="password" id="regPassword" placeholder="••••••••" minlength="6" required autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label for="regConfirmPassword">Confirm Password</label>
                    <input type="password" id="regConfirmPassword" placeholder="••••••••" minlength="6" required autocomplete="new-password">
                </div>
            </div>
            <div class="form-hint" style="margin-top: -6px; margin-bottom: 14px;">At least 6 characters.</div>

            <div class="form-group">
                <label for="regContact">Contact Number</label>
                <input type="tel" id="regContact" placeholder="09XX XXX XXXX" required autocomplete="tel">
            </div>

            <button type="submit" class="btn-register">Create Account</button>

            <div id="formMessage" class="form-message"></div>
        </form>

        <div class="login-link">Already have an account? <a href="KRAFTEDlogin.html">Log in</a></div>
        <a href="index.html" class="back-link">← Return to Storefront</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="krafted.js"></script>
</body>
</html>
