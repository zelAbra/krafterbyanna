<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | KRAFTED by ANNA</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --container-bg: rgba(250, 240, 242, 0.85); 
            --card-bg: rgba(255, 255, 255, 0.95);
            --primary-pink: #E0A0AC;
            --text-dark: #5C4A4E;
            --border-color: rgba(234, 204, 211, 0.8);
            --radius: 12px;
            --transition-fast: 0.18s ease;
            --transition-base: 0.28s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            color: var(--text-dark);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: url("kraftedbg.jfif");
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            background-color: #F8E2E7;
        }

        .login-card {
            background-color: var(--card-bg);
            padding: 40px 30px;
            border-radius: var(--radius);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 380px;
            text-align: center;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(5px);
            animation: cardEnter 0.45s ease both;
        }

        @keyframes cardEnter {
            from { opacity: 0; transform: translateY(16px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .login-logo {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            border: 3px solid #FFFFFF;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .login-card h2 {
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
            color: var(--text-dark);
        }

        .login-card .subtitle {
            font-size: 0.78rem;
            color: #8C7B7F;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.72rem;
            font-weight: 600;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-dark);
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
            background: #fff;
            color: var(--text-dark);
            transition: border-color var(--transition-fast), box-shadow var(--transition-base);
        }

        .form-group input:hover {
            border-color: rgba(224, 160, 172, 0.7);
        }

        .form-group input:focus {
            border-color: var(--primary-pink);
            box-shadow: 0 0 0 3px rgba(224, 160, 172, 0.2);
        }

        .btn-login {
            width: 100%;
            background-color: var(--primary-pink);
            color: white;
            border: none;
            padding: 13px;
            border-radius: 24px;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            cursor: pointer;
            margin-top: 12px;
            box-shadow: 0 4px 14px rgba(224, 160, 172, 0.4);
            transition: transform var(--transition-base), box-shadow var(--transition-base), opacity var(--transition-fast);
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(224, 160, 172, 0.5);
        }

        .btn-login:active {
            transform: translateY(0) scale(0.98);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .form-message {
            display: none;
            margin-top: 16px;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: 500;
            text-align: left;
        }

        .form-message.error {
            display: block;
            background: #fdecea;
            color: #c0392b;
            border: 1px solid #f5c6c1;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: var(--text-dark);
            text-decoration: none;
            font-size: 0.78rem;
            font-weight: 500;
            padding: 6px 12px;
            border-radius: 16px;
            transition: background-color var(--transition-fast), color var(--transition-fast);
        }

        .back-link:hover {
            background: rgba(224, 160, 172, 0.15);
            color: #C06C84;
        }

        .register-link {
            margin-top: 18px;
            font-size: 0.78rem;
            color: var(--text-light, #8C7B7F);
        }

        .register-link a {
            color: #C06C84;
            font-weight: 600;
            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body data-page="login">

    <div class="login-card">
        <img src="Kraftedlogo.jfif" alt="Logo" class="login-logo">
        <h2>Welcome Back</h2>
        <div class="subtitle">One login for shopping or managing the store</div>

        <form id="loginForm" novalidate>
            <div class="form-group">
                <label for="username">Email</label>
                <input type="email" id="username" placeholder="you@example.com" required autocomplete="email">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn-login">Log In</button>

            <div id="loginMessage" class="form-message"></div>
        </form>

        <div class="register-link">Don't have an account? <a href="KRAFTEDregister.html">Register</a></div>
        <a href="KRAFTED.html" class="back-link">← Return to Storefront</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="krafted.js"></script>
</body>
</html>
